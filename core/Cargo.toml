[package]
name = "cassini-core"
description = "Moteur geographique et registre de commandes de Cassini"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Dependances autorisees par le proprietaire le 2026-10-15 (CLAUDE.md §8) :
# schemars (MIT), serde et serde_json (MIT OR Apache-2.0), inventory (MIT OR Apache-2.0, donnee le 2026-10-15).
# Toute dependance future passe par la regle de licence du §2.2 de CLAUDE.md.
[dependencies]
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
inventory = "0.3"
# tiff (MIT), acceptee par le proprietaire le 2026-11-03 (entree 4.1) : lecture et ecriture
# des MNT GeoTIFF dans core/src/dem.rs, sans GDAL (AD-1). Fonctions JPEG, WebP et fax
# desactivees : seules les compressions deflate et LZW, en pur Rust, sont tirees.
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw"] }
# libm (MIT OR Apache-2.0, sans dependance), acceptee par le proprietaire le 2026-11-05
# (ticket 4.11) : arc tangente en pur Rust pour la pente en degres, memes octets sous Windows
# et sous Linux. Version figee : un changement d'arc tangente ferait diverger le rejeu.
libm = "=0.2.15"

# windows-sys (MIT OR Apache-2.0), acceptee par le proprietaire le 2026-10-30 (ticket 5.24) :
# l'API Win32 des tubes nommes du canal d'IA externe (AD-14), compilee seulement sous Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# Instrument de la comparaison du terrain aux outils de référence, natif et GRASS (ticket 7) : ses tests passent avec la recette.
[[example]]
name = "comparer_terrain"
test = true
