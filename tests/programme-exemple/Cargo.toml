[package]
name = "programme-exemple"
description = "Programme noyau d'exemple : le registre officiel plus une commande ajoutee fictive (entree 2.14)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "programme_exemple"
path = "src/lib.rs"

[[bin]]
name = "programme-exemple"
path = "src/main.rs"

# Memes dependances que l'integrateur : la bibliotheque `cassini` (points d'entree et programme
# compose) et `cassini-core` (registre), Apache-2.0 ; schemars et serde (MIT OR Apache-2.0)
# decrivent les types de la commande ajoutee. Aucune bibliotheque GPL/LGPL, ni QGIS, GDAL, GEOS
# ou PROJ (AD-1).
[dependencies]
cassini = { path = "../../cli" }
cassini-core = { path = "../../core" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
