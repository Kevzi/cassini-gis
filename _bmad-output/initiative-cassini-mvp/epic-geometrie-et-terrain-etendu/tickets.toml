[[entry]]
id = 20
type = "story"
title = "Table de semiologie et reconnaissance dans le noyau"
description = "Dans le noyau : la table des themes (eau de surface, cours d'eau, vegetation, routes par importance, voie ferree, bati par usage, limites administratives, zones du PLU au standard CNIG, MNT en teintes d'altitude, ombrage), chaque couleur sourcee dans la documentation publique de l'IGN ou du CNIG ; la reconnaissance d'une couche par son nom, son fichier et ses champs ; map.topographic_style, qui lit l'inventaire et dicte un layer.set_style par couche reconnue, en rendant styled et unchanged."
verify = "Tests sans QGIS : sur des inventaires synthetiques reprenant Villeneuve-le-Roi et Annecy, chaque couche attendue recoit son theme et son StyleSpec, une couche inconnue va dans unchanged ; les ordres dictes sont journalises et le rejeu les redonne dans le meme ordre ; aucune couleur sans source."
covers = ["G13"]
after = [19]
hitl = false
risk = "medium"

[[entry]]
id = 21
type = "story"
title = "Geste layer.set_style dans l'extension et demonstration"
description = "La ligne de la table fermee pour layer.set_style et la traduction de StyleSpec en rendu QGIS (symbole simple, categories par valeur de champ, rampe d'altitudes, ombrage en fondu), sans toucher aux fichiers d'origine ; puis la sonde QGIS sur Villeneuve-le-Roi et Annecy."
verify = "Sous QGIS 3.44 : map.topographic_style met l'eau en bleu, les bois en vert, les routes par importance et le PLU aux couleurs CNIG ; le PDF exporte, rendu en image, le montre ; le rejeu redonne les memes styles ; les fichiers d'origine sont inchanges ; le proprietaire confirme la carte."
covers = ["G13"]
after = [20]
hitl = true
risk = "high"

[[entry]]
