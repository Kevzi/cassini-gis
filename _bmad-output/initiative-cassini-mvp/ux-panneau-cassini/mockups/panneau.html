<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassini — maquette du panneau</title>
<style>
:root{
  color-scheme: light;
  --bg:#f1f1f1; --panel:#fafafa; --raised:#ffffff; --ink:#1f1f1f; --muted:#5f5f5f;
  --disabled:#9a9a9a; --border:#c9c9c9; --hl:#d7e6f5; --btn:#e8e8e8;
  --accent:#0E8F86;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#1b1b1b; --panel:#2b2b2b; --raised:#222222; --ink:#ececec; --muted:#b0b0b0;
    --disabled:#777777; --border:#4a4a4a; --hl:#27425e; --btn:#3a3a3a; --accent:#3FD0C4;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1b1b1b; --panel:#2b2b2b; --raised:#222222; --ink:#ececec; --muted:#b0b0b0;
  --disabled:#777777; --border:#4a4a4a; --hl:#27425e; --btn:#3a3a3a; --accent:#3FD0C4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Segoe UI",sans-serif;padding-inline:16px;padding-block:16px}
h1{font-size:16px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 12px}
.bar{display:flex;gap:8px;margin-bottom:16px}
.bar button{font:inherit}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
figure{margin:0}
figcaption{font-weight:600;margin-bottom:6px}
.panel{width:340px;max-width:100%;background:var(--panel);border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:8px}
header svg{width:24px;height:24px;flex:none}
header .t{font-weight:600;flex:1}
button,select,textarea{font:inherit;color:var(--ink)}
button{background:var(--btn);border:1px solid var(--border);padding:4px 10px;border-radius:3px;cursor:pointer}
button[disabled]{color:var(--disabled);cursor:default}
button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.icon{padding:2px 6px}
textarea{width:100%;min-height:64px;background:var(--raised);border:1px solid var(--border);border-radius:3px;padding:6px;resize:none}
textarea:disabled{color:var(--disabled)}
.why{color:var(--muted);font-size:13px;margin:4px 0 0}
.meta{color:var(--muted);font-size:12px}
.tech{font-family:ui-monospace,Consolas,monospace;font-size:13px}
h2{font-size:13px;font-weight:600;margin:0 0 4px}
details{border:1px solid var(--border);border-radius:3px;background:var(--raised)}
summary{padding:6px 8px;cursor:pointer;font-weight:600}
.in{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.cmds{list-style:none;margin:0;padding:0;border:1px solid var(--border);border-radius:3px}
.cmds li{padding:4px 8px;display:flex;justify-content:space-between;gap:8px}
.cmds li[aria-selected="true"]{background:var(--hl)}
.cmds li.off{color:var(--disabled)}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:6px;align-items:baseline;padding:3px 0;border-top:1px solid var(--border)}
.log li:first-child{border-top:0}
.log .time{margin-left:auto;color:var(--muted);font-size:12px}
.st{font-weight:600}
.ic{width:1.1em;text-align:center;flex:none}
.run .ic{color:var(--accent)}
.banner{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-left:4px solid var(--ink);background:var(--raised);padding:8px;border-radius:3px}
.banner p{margin:0 0 6px}
.res{background:var(--raised);border:1px solid var(--border);border-radius:3px;padding:8px}
.res p{margin:0 0 4px}
.foot{margin-top:auto;color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:6px}
.sr{position:absolute;left:-9999px}
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:40%;background:var(--accent)}
.off-group{opacity:.95}
</style>
</head>
<body>
<h1>Cassini — maquette du panneau (états illustratifs)</h1>
<p class="lead">Panneau étroit (environ 340 px), ancré à droite dans QGIS. Textes issus de EXPERIENCE.md. Le thème suit le système ; les boutons ci-dessous le forcent.</p>
<div class="bar" role="group" aria-label="Thème de la maquette">
  <button type="button" onclick="document.documentElement.removeAttribute('data-theme')">Thème du système</button>
  <button type="button" onclick="document.documentElement.setAttribute('data-theme','light')">Clair</button>
  <button type="button" onclick="document.documentElement.setAttribute('data-theme','dark')">Sombre</button>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 100 100"><g fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M72 14 A40 40 0 0 1 72 86"/><g transform="rotate(-23 50 48)"><circle cx="50" cy="48" r="26"/><ellipse cx="50" cy="48" rx="11" ry="26"/><path d="M24 48h52M29 36h42M29 60h42"/></g><path d="M38 86h28M52 86v-6"/></g></symbol>
</svg>

<div class="row">

<!-- (a) accueil + mode expert -->
<figure>
<figcaption>(a) Accueil, mode expert déplié</figcaption>
<section class="panel" aria-label="Cassini, accueil">
  <header>
    <svg role="img" aria-label="Logo Cassini"><use href="#logo"/></svg>
    <span class="t">Cassini</span>
    <button class="icon" type="button" aria-label="Réglages">Réglages</button>
  </header>

  <div>
    <label for="a-in" class="sr">Votre demande en langage naturel</label>
    <textarea id="a-in" disabled placeholder="Décrivez ce que vous voulez faire sur vos données."></textarea>
    <p class="why">Disponible avec l'agent.</p>
  </div>

  <div class="res" aria-live="polite">
    <h2>Résultat</h2>
    <p>Le noyau Cassini répond et son protocole est compatible.</p>
    <details style="border:0;background:none"><summary style="padding:0;font-weight:400">Détails techniques</summary><p class="tech meta">system.about : ok</p></details>
  </div>

  <div>
    <h2>Journal de cette session</h2>
    <ul class="log">
      <li><span class="ic" aria-hidden="true">✓</span><span class="st">Terminée</span><span class="tech">system.about</span><span class="time">10:42</span></li>
    </ul>
  </div>

  <details open>
    <summary>Mode expert : lancer une commande</summary>
    <div class="in">
      <ul class="cmds" role="listbox" aria-label="Commandes disponibles">
        <li role="option" aria-selected="true"><span class="tech">system.about</span><span class="meta">Versions du noyau</span></li>
        <li role="option" aria-selected="false" class="off"><span class="tech">test.qgis_probe</span><span class="meta">Indisponible : [raison]</span></li>
      </ul>
      <div style="display:flex;gap:8px">
        <button type="button">Lancer</button>
        <button type="button" disabled>Arrêter</button>
      </div>
    </div>
  </details>

  <details>
    <summary>Réglages</summary>
    <div class="in">
      <label>Langue <select><option>Français</option><option>English</option></select></label>
      <label>Modèle <select disabled><option>Choisi avec l'agent</option></select></label>
    </div>
  </details>

  <div class="foot">Cassini fonctionne sans connexion. Aucune donnée ne quitte votre poste.</div>
</section>
</figure>

<!-- (b) commande lente en cours -->
<figure>
<figcaption>(b) Commande lente en cours</figcaption>
<section class="panel" aria-label="Cassini, commande en cours">
  <header>
    <svg role="img" aria-label="Logo Cassini"><use href="#logo"/></svg>
    <span class="t">Cassini</span>
    <button class="icon" type="button" aria-label="Réglages">Réglages</button>
  </header>

  <div>
    <label for="b-in" class="sr">Votre demande en langage naturel</label>
    <textarea id="b-in" disabled placeholder="Décrivez ce que vous voulez faire sur vos données."></textarea>
    <p class="why">Disponible avec l'agent.</p>
  </div>

  <div class="res" aria-live="polite">
    <h2>Résultat</h2>
    <p class="run"><span class="ic" aria-hidden="true">●</span> En cours… <span class="tech">test.qgis_probe</span></p>
    <div class="progress" role="progressbar" aria-label="Commande en cours" aria-valuetext="En cours"><i></i></div>
    <p class="why">Une commande est déjà en cours. Attendez sa fin ou arrêtez-la.</p>
  </div>

  <div>
    <h2>Journal de cette session</h2>
    <ul class="log">
      <li class="run"><span class="ic" aria-hidden="true">●</span><span class="st">En cours…</span><span class="tech">test.qgis_probe</span><span class="time">10:44</span></li>
      <li><span class="ic" aria-hidden="true">✓</span><span class="st">Terminée</span><span class="tech">system.about</span><span class="time">10:42</span></li>
    </ul>
  </div>

  <details open>
    <summary>Mode expert : lancer une commande</summary>
    <div class="in">
      <div style="display:flex;gap:8px;align-items:center">
        <button type="button" disabled>Lancer</button>
        <button type="button">Arrêter</button>
      </div>
      <p class="why" style="margin:0">Pour une étape non annulable, Arrêter reste grisé : « Arrêt impossible : cette étape ne peut pas être interrompue. »</p>
    </div>
  </details>

  <div class="foot">Cassini fonctionne sans connexion. Aucune donnée ne quitte votre poste.</div>
</section>
</figure>

<!-- (c) noyau absent -->
<figure>
<figcaption>(c) Noyau absent</figcaption>
<section class="panel" aria-label="Cassini, noyau absent">
  <header>
    <svg role="img" aria-label="Logo Cassini"><use href="#logo"/></svg>
    <span class="t">Cassini</span>
    <button class="icon" type="button" aria-label="Réglages">Réglages</button>
  </header>

  <div class="banner" role="alert">
    <span class="ic" aria-hidden="true">✕</span>
    <div>
      <p><strong>Erreur.</strong> Le noyau Cassini est introuvable. Installez le paquet Cassini, ou désignez le fichier. Rien n'est téléchargé.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button">Relancer</button>
        <button type="button">Choisir le noyau</button>
      </div>
    </div>
  </div>

  <div>
    <label for="c-in" class="sr">Votre demande en langage naturel</label>
    <textarea id="c-in" disabled placeholder="Décrivez ce que vous voulez faire sur vos données."></textarea>
    <p class="why">Disponible avec l'agent.</p>
  </div>

  <details>
    <summary>Mode expert : lancer une commande</summary>
    <div class="in"><p class="why" style="margin:0">Indisponible tant que le noyau n'est pas démarré.</p></div>
  </details>

  <div>
    <h2>Journal de cette session</h2>
    <p class="meta" style="margin:0">Rien n'a encore été lancé.</p>
  </div>

  <div class="foot">Cassini fonctionne sans connexion. Aucune donnée ne quitte votre poste.</div>
</section>
</figure>

</div>
</body>
</html>
