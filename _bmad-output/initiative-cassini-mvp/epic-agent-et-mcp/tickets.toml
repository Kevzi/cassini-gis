description = "La commande d'entrainement prend un fichier d'exemples fourni de l'exterieur, au format chat ({prompt, completion}), en plus du jeu engendre depuis le registre, pour entrainer un adaptateur de domaine hors de ce depot. Elle produit un adaptateur sur la meme base et avec le meme prompt court, sous un nom choisi qui n'ecrase pas le modele civil, avec sa declaration *.modele.json. Le rapport consigne l'empreinte du fichier externe et le nombre de ses exemples, jamais son contenu. Une ligne mal formee arrete la chaine avant l'entrainement, en nommant la ligne."
verify = "Tests sans GPU sur un petit fichier synthetique : lecture, refus d'une ligne fausse, melange des jeux, noms de sortie, empreinte dans le rapport. Un court entrainement reel (--pas-max) avec un fichier externe synthetique sort l'adaptateur et sa declaration, model.list les voit, le modele civil existant n'est pas touche. cargo deny et les tests de training/ restent verts."
covers = ["CAP-4"]
after = [17]
hitl = false
