[[entry]]
id = 16
type = "story"
title = "Garde-fou : une coordonnee du plan vient de la demande, jamais du modele"
description = "Ajoute au noyau une regle generale, valable pour toute commande qui prend un point : une coordonnee d'un plan compose doit figurer dans la demande de l'utilisateur ou venir du resultat d'une etape precedente. Sinon le noyau ne montre pas le plan et rend lui-meme une question qui demande le point en coordonnees (x, y et systeme), sous la forme de question de 5.5. Le signal du declenchement est journalise, pour que les mesures sachent si la question vient du modele ou du garde-fou. Corrige la phrase E du scenario, a laquelle le modele de 5.15 rend une isochrone d'origine inventee (EPSG:4326, 2,458 / 48,658) acceptee sans alerte."
verify = "La phrase E sur l'inventaire de Villeneuve-le-Roi rend une question et aucun plan, avec le modele de 5.15 ; un test sans modele montre qu'un plan a coordonnees absentes de la demande devient cette question, et qu'un plan dont les coordonnees sont dans la demande passe inchange ; plan_reel, question_reel et ecart_reel sur GPU ne baissent pas par rapport a 5.15 ; la demo de bout en bout dans QGIS est rejouee avec la phrase de demo exacte et avec la phrase E."
covers = ["CAP-4"]
after = [15]
hitl = true
risk = "high"
references = ["architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-23"]
notes = [
  "Decision: 2026-10-23 — le proprietaire veut que le probleme de la phrase E soit resolu a coup sur : un garde-fou du noyau, regle generale sur la provenance des coordonnees, et non une regle de prompt ni un correctif par phrase.",
  "Decision: 2026-10-23 — quand le garde-fou se declenche, le noyau rend une question (le point de depart en coordonnees), ni redemande au modele ni simple erreur.",
  "Decision: 2026-10-23 — cette regle etend AD-23 (un plan ne nomme que des chemins deja connus de la session) aux coordonnees. Le contrat d'architecture est mis a jour par bmad-architecture avant le build de ce ticket.",
  "Decision: 2026-10-23 — 5.15 reste sur sa branche et n'est fusionnee dans main qu'apres ce ticket et la recette du proprietaire dans QGIS ; ce ticket part de cette branche.",
  "Assumption: le garde-fou s'applique apres judge et retry_turns, sans changer le prompt, judge ni le tour de redemande ; la parite au jeton avec l'entrainement reste intacte.",
  "Decision: 2026-10-23 — AD-23 etendu aux coordonnees (type Point partage marque au schema, x, y et systeme exiges dans la demande, reference step: vers un Point de sortie, controle a la fin de la composition, provenance model|guard dans la question, rien au journal) ; le build suit ce texte.",
  "Decision: 2026-10-23 — quand le garde-fou rend sa question, le panneau remet la phrase d'origine dans la zone de saisie, pour que l'utilisateur y ajoute le point.",
  "Open question: ecritures d'un nombre a reconnaitre dans la demande (2,458 et 2.458, 652 000) ; a trancher au debut du build.",
  "hitl : le proprietaire fait la recette dans QGIS avec la phrase E et la phrase de demo.",
  "Check hors criteres (risque high) : le proprietaire rejoue dans QGIS la phrase E et une phrase avec des coordonnees donnees, et confirme le comportement.",
]

