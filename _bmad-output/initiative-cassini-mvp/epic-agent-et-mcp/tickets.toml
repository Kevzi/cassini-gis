  "Decision: 2026-10-30 — le proprietaire accepte windows-sys (MIT OR Apache-2.0, deja indirecte dans Cargo.lock) comme dependance directe du noyau, compilee seulement sous Windows, pour le tube nomme (CLAUDE.md §8).",
