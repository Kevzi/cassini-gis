[[entry]]
id = 28
type = "story"
title = "Execution des appels du relais : la session QGIS execute ce que l'IA externe demande"
description = "Seconde moitie de 24. Le noyau de la session execute les command.run d'un relais attache, commandes QGIS comprises, dictees a l'extension comme une etape de plan. Un seul etat d'occupation vaut pour l'extension et les relais : session.busy dans les deux sens ; un plan propose non tranche occupe la session pour le relais seulement, et l'extension garde le droit de le remplacer par plan.propose. Chaque appel est annonce a l'extension par external.call, avec son identifiant d'appel ; si ask est allume (session.external de 24), external.approve attend l'accord 120 s, sinon external.not_approved. Tout chemin absolu venu d'un relais est refuse (external.path_refused). request.cancel arrete un appel par son identifiant. Le journal porte l'origine external et se rejoue. Un relais recoit external.session_lost si la session coupe en plein appel, et un relais qui se deconnecte en plein appel ne laisse pas la session occupee. Fixe la forme des messages que 25 et 26 consomment (AD-4, AD-6, AD-7, AD-9, AD-12, AD-21, AD-29)."
verify = "cargo test -p cassini-core --test canal_externe passe sous Linux et Windows, avec un client brut du canal et une extension simulee : appel execute et journalise external, appel QGIS dicte, occupation croisee dans les deux sens, plan non tranche remplace par l'extension, refus et delai de validation, chemin refuse, annulation par identifiant, perte de session et deconnexion du relais en plein appel, rejeu d'un journal portant des etapes external ; hors_ligne.rs, la recette pytest de l'extension et cargo deny check restent verts ; docs/canal-local.md decrit les nouveaux messages."
