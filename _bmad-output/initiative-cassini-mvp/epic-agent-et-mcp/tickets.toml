[[entry]]
id = 10
type = "story"
title = "Modele de composition ajuste et plus petit (fine-tuning)"
description = "Remplace le gros modele et son prompt de 5000 jetons par un modele de 1,5 a 4 milliards de parametres ajuste sur « phrase francaise -> plan d'appels du registre », au prompt de quelques centaines de jetons, pour les postes sans bon processeur. Le generateur de donnees synthetiques sort du registre reel, filtre par Registry::check_plan ; un jeu de phrases inedites est tenu a l'ecart ; l'entrainement (LoRA ou QLoRA) tient dans 8 Go de VRAM et se fusionne en GGUF."
verify = "Sur le jeu de phrases tenu a l'ecart, le score du modele ajuste est au moins egal a celui de Qwen3.5-9B avec le prompt complet, et une longue phrase rend son plan en moins de 30 s sur le 5800X bride a 4 coeurs (mesure de l'entree 11), y compris sur les postes ou l'entree 12 n'y suffit pas."
covers = ["CAP-4"]
after = [3, 5, 11, 12]
hitl = true
risk = "high"
notes = [
  "Context: 5.3 livre 25/25 sur Qwen3.5-9B Q4_K_M avec un prompt de ~5000 jetons ; 4350 s pour 25 phrases sur le CPU du proprietaire (~3 min par phrase), ~11 s sur RTX 3070 Ti.",
  "Decision: 2026-10-17 — le jeu de phrases inedites n'est jamais lu en ecrivant le prompt ni les donnees d'entrainement ; sinon le score ne mesure rien.",
  "Decision: 2026-10-17 — licence du modele de base Apache-2.0 ou MIT ; les donnees d'entrainement sont generees par nous.",
  "Assumption: un modele de 1,5 a 4 milliards tient la tache apres ajustement ; la cible de 8 Go de VRAM exclut un entrainement du 9B sans compromis. A confirmer a la mesure.",
  "Assumption: chaque nouvelle commande du registre demande de regenerer les donnees et de re-entrainer ; le cout de cette boucle est a mesurer.",
  "hitl : le proprietaire fournit le processeur modeste de mesure et lance l'entrainement sur sa machine.",
  "Check hors criteres (risque high) : le proprietaire rejoue la phrase de demo sur le 5800X bride a 4 coeurs et confirme que le temps est sous 30 s.",
  "Decision: 2026-10-17 — apres 5.5 : le format des plans (variante question) doit etre fige avant d'entrainer, sinon on re-entraine.",
  "Hors de cette story : garder le prefixe fixe du prompt en cache et ne charger le modele qu'une fois — c'est l'entree 12.",
  "Decision: 2026-10-17 — seuil strict de clarification reporte de 5.5 : au moins 9 des 12 phrases ambigues rendent une question, au plus 1 des 25 phrases claires devient une question (5.5 a accepte 2 pour le modele actuel).",
  "Decision: 2026-10-17 — l'entrainement est reproductible : exemples engendres depuis le registre, une commande pour re-entrainer et re-mesurer, pour qu'une commande ajoutee coute un re-entrainement et non un projet.",
  "Decision: 2026-10-17 — critere de duree : moins de 30 s par longue phrase sur le 5800X bride a 4 coeurs, mesure par l'entree 11.",
  "Decision: 2026-10-17 — graine des exemples : les inventaires de demandes types tires de la recherche sur les pratiques SIG (hors depot), en plus du registre.",
  "Decision: 2026-10-22 — le but est un modele qui comprend le vocabulaire metier (urbanisme, environnement, SIG general), pas un correctif par phrase : une phrase mal comprise devient une famille d'exemples d'entrainement, jamais une regle de prompt. Constat : la phrase de demo de CLAUDE.md, sans « (zones U) », rend une question sur Qwen3.5-9B (« Aucune couche de parcelles constructibles »).",
  "Decision: 2026-10-22 — la phrase de demo exacte de CLAUDE.md (sans « (zones U) ») entre dans le jeu tenu a l'ecart et ferme la story par une demo de bout en bout dans QGIS, faite par Claude avant la recette du proprietaire.",
  "Decision: 2026-10-22 — le modele ajuste de ce depot reste civil et generaliste. La methode d'entrainement doit permettre d'ajouter plus tard un adaptateur LoRA de domaine, entraine hors de ce depot sur la meme base, sans re-entrainer la base : base et adaptateur se chargent ensemble, le choix passe par le selecteur de 5.14.",
]

[[entry]]
id = 15
type = "story"
title = "Re-entrainement du modele ajuste sur les familles manquantes"
description = "Ajoute au generateur les familles d'exemples que les mesures de la tache 4b de 5.10 ont montrees manquantes, regenere le jeu, re-entraine par la commande unique de 5.10 (meme base, meme methode, adaptateur de domaine toujours possible), fusionne en GGUF et re-mesure par ai/. Familles : refus des demandes que le registre n'a pas encore (champ de vision, ligne de vue, pente, cadrage de la carte, PDF en A3, statistiques sur un raster), au lieu d'un plan de substitution ou invalide ; plans a plusieurs conditions sans etape perdue ni ajoutee (H08, H17 a H20, H22) ; question quand l'appartenance a la commune n'a pas de couche (Q11) ; question pour une isochrone sans origine en coordonnees (phrase E du scenario) ; refus attendu rendu comme tel (H40) ; le tour de redemande, pour qu'une sortie rejetee puisse etre sauvee. Dettes du generateur reportees par 5.10 : valeurs d'un champ triees comme le produit, formes d'inventaire vues dans QGIS (couche sans fichier, projet non enregistre, SCR non EPSG, table sans geometrie, unloaded_files vide), precision « (en comptant a partir de 1) » rendue au prompt court."
verify = "Sur GPU, par ai/ et la declaration du modele livre : plan_reel au moins 20/25, jeu tenu a l'ecart au moins 32/40, au moins 9 des 12 phrases ambigues rendent une question et au plus 1 des 25 phrases claires, la phrase E rend une question ; la demo de bout en bout dans QGIS avec la phrase de demo exacte est rejouee ; les chiffres sont consignes dans docs/entrainement-du-modele.md."
covers = ["CAP-4"]
after = [10]
hitl = true
risk = "high"
notes = [
  "Decision: 2026-10-23 — perimetre fixe par le proprietaire : justesse seule. La duree de la phrase de demo (41,4 s sur 4 coeurs, plan ecrit de 248 jetons) reste dans deferred-work.md et n'est pas un critere de ce ticket.",
  "Decision: 2026-10-23 — la barre est celle de 5.10 ; atteinte, elle ferme 5.10, reste ouvert apres la tache 4b.",
  "Decision: 2026-10-22 (reprise de 5.10) — une phrase mal comprise devient une famille d'exemples, jamais une regle de prompt ni un correctif par phrase.",
  "Decision: 2026-10-17 (reprise de 5.10) — le jeu tenu a l'ecart n'est jamais lu pour ecrire les familles : les identifiants H et Q nomment des constats, les exemples s'ecrivent sans recopier ces phrases.",
  "Decision: 2026-10-22 (reprise de 5.10) — le modele de ce depot reste civil et generaliste.",
  "Changer le prompt court (precision « en comptant a partir de 1 ») oblige a garder la parite des decoupeurs et l'egalite octet pour octet du prompt entre l'entrainement et ai/.",
  "hitl : le proprietaire fait la recette dans QGIS apres la demo de Claude ; l'entrainement tourne sur sa carte graphique.",
  "Check hors criteres (risque high) : le proprietaire rejoue la phrase de demo et deux phrases de refus dans QGIS et confirme le comportement.",
]

[[entry]]
