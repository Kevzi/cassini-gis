# tickets.toml — epic-export-et-demo (epic 6). Decoupage approuve par le proprietaire le 2026-11-05.

[[entry]]
id = 1
type = "story"
title = "La sonde de demo juge la phrase de demo sur des fixtures synthetiques"
description = "Ajoute aux fixtures un petit projet de demo synthetique en EPSG:2154 (zones du PLU de type U et N, parcelles, gares) et fait de la sonde de demo existante un juge : elle part de ce projet par defaut, ou d'un projet donne en argument, envoie la phrase de demo au vrai modele, valide le plan, l'execute et rend un verdict OK ou ECHEC avec la raison. Le projet de fixtures et l'argument de projet sont repris par les entrees 4 (MNT ajoute a ces fixtures) et 6 (projet reel passe en argument)."
verify = "Lancee sous le Python de QGIS sur le poste du proprietaire, la sonde rend OK sur les fixtures : un plan compose, chaque etape reussie, des parcelles en zone U retenues, un PDF qui commence par %PDF ; elle rend ECHEC, code de sortie non nul, quand une etape echoue."
covers = ["D1", "D5"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "La sonde de demo rejoue le journal apres fermeture et reouverture du projet"
description = "Apres la phrase de demo, la sonde ferme le projet, le rouvre et rejoue le journal sans le modele ; elle compare chaque etape et ajoute le rejeu a son verdict."
verify = "Sur les fixtures, la sonde rend OK avec un rejeu identique etape par etape ; un journal altere a la main fait rendre ECHEC en nommant l'etape qui diverge."
covers = ["D2", "D5"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "La sonde de demo verifie le contenu du PDF"
description = "La sonde lit la mise en page QGIS du projet apres l'export (ses elements : etiquette de titre, legende, barre d'echelle, fleche du nord, etiquette des sources) et controle qu'elle porte un titre, une legende, une echelle, une fleche du nord et les sources, et que le PDF n'est pas vide ; un element manquant fait echouer le verdict en le nommant."
verify = "Sur les fixtures, la sonde rend OK et liste les cinq elements trouves ; une mise en page privee de sa legende fait rendre ECHEC en nommant la legende."
covers = ["D3", "D5"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "La demo passe par la pente du MNT"
description = "Reprend un MNT synthetique deja present dans fixtures/ (mnt-colline-2154.tif ou mnt-plan-incline-2154.tif, en EPSG:2154) et cale les fixtures de demo de l'entree 1 sur son emprise, sans creer de nouvelle source de MNT, et a la sonde une seconde phrase qui demande la pente du MNT en degres et l'ajoute a la carte ; la pente est rejouee par le rejeu de l'entree 2 et son PDF controle par l'entree 3."
verify = "Sur les fixtures, la sonde rend OK : la phrase de pente donne un plan avec terrain.slope, la couche de pente apparait dans le projet et dans le PDF, et le rejeu apres reouverture reste identique."
covers = ["D4", "D5"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "La sonde de demo prouve qu'aucune sortie reseau n'a lieu"
description = "Pendant toute la demo, la sonde releve les sockets ouvertes par le processus du noyau Cassini vers une adresse non locale, et echoue si elle en trouve une. Les connexions propres a QGIS ne sont pas surveillees ici : la demo machine debranchee de l'entree 6 les couvre."
verify = "Sur les fixtures, la sonde rend OK avec zero connexion reseau relevee ; une connexion de test ouverte expres vers une adresse externe fait rendre ECHEC en la nommant."
covers = ["D1", "D5"]
after = [4]
hitl = false
risk = "medium"

