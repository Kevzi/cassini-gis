# tickets.toml — epic-export-et-demo (epic 6). Decoupage approuve par le proprietaire le 2026-11-05.

[[entry]]
id = 1
type = "story"
title = "La sonde de démo juge la phrase, rejoue le journal et vérifie le PDF"
description = "Ajoute aux fixtures un petit projet de demo synthetique en EPSG:2154 (zones du PLU de type U et N, parcelles, gares) et fait de la sonde de demo existante un juge : elle part de ce projet par defaut, ou d'un projet donne en argument, envoie la phrase de demo au vrai modele, valide le plan, l'execute ; puis elle ferme le projet, le rouvre et rejoue le journal sans le modele en comparant chaque etape ; enfin elle lit la mise en page QGIS apres l'export et controle titre, legende, echelle, fleche du nord et sources, et que le PDF n'est pas vide ; elle rend un verdict OK ou ECHEC avec la raison. Le projet de fixtures et l'argument de projet sont repris par les entrees 4 (MNT ajoute a ces fixtures) et 6 (projet reel passe en argument). Fusion de 6.1, 6.2 et 6.3 (2026-11-12)."
verify = "Lancee sous le Python de QGIS sur le poste du proprietaire, la sonde rend OK sur les fixtures : un plan compose, chaque etape reussie, des parcelles en zone U retenues, un rejeu identique etape par etape apres reouverture, les cinq elements de mise en page listes et un PDF qui commence par %PDF ; elle rend ECHEC, code de sortie non nul, en nommant la cause quand une etape echoue, quand un journal altere a la main diverge (etape nommee) ou quand la mise en page perd sa legende (legende nommee)."
covers = ["D1", "D2", "D3", "D5"]
after = []
hitl = false
risk = "medium"

