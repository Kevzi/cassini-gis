[[entry]]
id = 9
type = "story"
title = "Mettre le README au plan du 14 octobre"
description = "Remet le README racine en accord avec le virage vers la facade QGIS : la section des etapes, les trois schemas Mermaid, le tableau des dossiers et la licence."
verify = "Le README ne decrit plus l'application autonome comme la cible du MVP, ses trois schemas montrent QGIS au-dessus du noyau, le tableau des dossiers porte /qgis-plugin et dit que /app est reporte en V2, et la licence distingue le noyau Apache-2.0 de l'extension GPL."
covers = ["E5"]
after = [5]
hitl = false
risk = "low"
notes = ["Bloque la poussee sur GitHub : le depot public afficherait sinon une feuille de route abandonnee."]

[[entry]]
id = 10
type = "story"
title = "Mettre le README au contrat d'architecture"
description = "Remet le README racine en accord avec le contrat d'architecture du 2026-10-14 : canal tranche (entree et sortie standard, JSON-RPC 2.0, dans les deux sens), dossier /cli et binaire cassini, plancher QGIS 3.44 a 4.99, distribution en deux artefacts, lecture du MNT par le noyau, et lien vers le contrat ; sans toucher au reste."
verify = "Le README ne dit plus nulle part que la forme du canal reste a trancher, ses schemas montrent le canal stdin/stdout et le binaire cassini sous /cli, le tableau des dossiers porte /cli, et chaque fait qu'il ajoute se retrouve dans le contrat d'architecture sous un AD-n."
covers = ["E5"]
after = [9]
hitl = false
risk = "low"
references = ["../architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md, AD-2, AD-3, AD-13, AD-17, AD-18, AD-20, Structural Seed et Arborescence"]
notes = ["Le proprietaire, le 2026-10-14 : le README n'est pas a jour sur GitHub. A pousser avec le contrat, la spec et les tickets du meme jour."]

[[entry]]
id = 11
type = "story"
title = "Maintenir la recette GitHub Actions a jour"
description = "Passe chaque action GitHub de la recette qui tourne encore sur Node.js 20 (actions/checkout, actions/setup-node, actions/setup-python, et toute autre action signalee) a une version majeure publiee qui tourne sur Node.js 24, et remplace l'etiquette ubuntu-latest par ubuntu-24.04 dans chaque job Linux, matrice du job extension comprise ; sans changer ce que la recette controle. EmbarkStudios/cargo-deny-action est une action Docker, hors du sujet Node.js."
verify = "Une poussee sur main donne une recette verte sur ses cinq jobs, Linux et Windows, sans aucune annotation de GitHub sur Node.js 20 ni sur la migration d'ubuntu-latest, et chaque job Linux annonce l'image ubuntu-24.04 dans son journal."
covers = ["E4"]
after = []
hitl = false
risk = "low"
notes = ["Decision (2026-11-05, proprietaire) : figer ubuntu-24.04 ; le passage a Ubuntu 26 fera l'objet d'un ticket a part.", "Decision (2026-11-05, proprietaire) : windows-latest reste tel quel, aucune annotation ne le signale.", "Constate le 2026-11-05 sur la recette 42032244055 : actions/checkout@v4, actions/setup-node@v4 et actions/setup-python@v5 forcees sur Node.js 24, image ubuntu-24.04 encore servie."]
