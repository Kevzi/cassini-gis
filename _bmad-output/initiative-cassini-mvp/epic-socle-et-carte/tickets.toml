# tickets.toml — epic 1, socle technique et carte hors ligne.
# L'ordre des tables est l'ordre de construction. `id` nomme une entree pour de bon.

[[entry]]
id = 1
type = "story"
title = "Squelette, moteur et carte hors ligne"
description = "Pose le workspace Cargo a deux etages, le moteur sans dependance avec son premier verrou hors ligne, la coquille Tauri avec son CSP, et la carte MapLibre en TypeScript strict."
verify = "La recette passe : tests du moteur, clippy -D warnings, cargo fmt --check, tsc strict, garde hors ligne, vite build."
covers = ["E1", "E2"]
after = []
hitl = false
risk = "medium"
notes = ["Traceur de l'epic : le chemin le plus mince qui traverse le moteur Rust, la coquille Tauri, la webview et MapLibre."]

[[entry]]
id = 2
type = "story"
title = "Generateur de fond de carte PMTiles de recette"
description = "Ecrit un script qui fabrique un petit PMTiles valide dans /fixtures, puisque le projet ne telecharge aucune donnee."
verify = "Le fichier genere est relu par la bibliotheque pmtiles et rend les tuiles attendues aux niveaux de zoom declares."
covers = ["E1"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "Brancher le fond PMTiles dans la carte"
description = "Fait lire le PMTiles local par MapLibre via le protocole pmtiles, et etend la garde hors ligne au nouveau chemin de chargement."
verify = "La carte affiche les tuiles du fichier de /fixtures sur une machine sans reseau, et la garde hors ligne echoue si une adresse reseau est introduite."
covers = ["E1", "E2"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
