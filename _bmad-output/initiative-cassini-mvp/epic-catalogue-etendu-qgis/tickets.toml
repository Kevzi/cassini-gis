# tickets.toml — epic 10, catalogue etendu par les algorithmes de traitement de QGIS.
# L'ordre des tables est l'ordre de construction ; `id` nomme une entree pour de bon.
# Les primitives (entrees 9 a 15, et 20) ajoutent chacune une ligne a la meme table fermee
# de l'extension, des modules au registre et des descriptions au prompt : elles forment
# une seule voie, chacune apres la precedente.

# ---- Mise a niveau avant la premiere primitive (deferred-work, gate de revue E1) ----

[[entry]]
id = 1
type = "story"
title = "Resultat valide par le noyau et gabarit unique de resume"
description = "Definit en Rust le gabarit de resume chiffre (rows, values avec unite, truncated) et fait valider par le noyau tout resultat recu de l'extension contre le schema de sortie de sa commande, rejete en qgis.bad_result ; les marqueurs du journal passent sous une cle reservee (bug latent summary.rs:24), et model.list cesse de rendre son dossier en chemin absolu (AD-9)."
verify = "Tests du noyau sans QGIS : un resultat mal forme est rejete en qgis.bad_result et non journalise, un resultat qui porte lui-meme truncated: true n'est plus confondu avec un resume tronque au rejeu, et aucun resultat de model.list ne porte de chemin absolu."
covers = ["CAP-6", "CAP-14"]
after = ["epic-export-et-demo", "epic-publication"]
hitl = false
risk = "high"
references = ["architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-27", "architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-11", "architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-21"]

[[entry]]
