verify = "Test de l'extension et test du noyau : un comptage simple et un comptage pondere rendent un resume au gabarit valide par le noyau ; l'ancien id n'existe plus nulle part, et les phrases S15, S23, S24 sont attendues en refus jusqu'a l'entree 12, qui les repasse en plan attendu vers raster.zonal_statistics."
