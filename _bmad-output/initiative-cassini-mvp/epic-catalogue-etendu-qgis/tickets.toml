risk = "medium"

# ---- Mise a niveau avant la premiere primitive (deferred-work, gate de revue E1) ----

[[entry]]
id = 27
type = "story"
title = "Retirer une couche du projet (layer.remove)"
description = "Ajoute layer.remove, deleguee a QGIS (entree project, sortie none, amendement du 2026-11-08 d'AD-24) : retire une couche du projet QGIS ouvert sans jamais effacer ni modifier son fichier (principe 6) ; une couche deja absente n'est pas une erreur ; resultat layer_id. Ajoute au catalogue la ligne du paragraphe 4 et la fiche du paragraphe 7 du changement de cap, puis la passe en faite dans le meme commit, ajoute la famille du generateur et retire le refus « retire une couche » devenu faux, rescore H35 du jeu tenu a l'ecart en plan d'une etape. Construite tout de suite, avant les entrees 1 a 6 (changement de cap du 2026-11-10)."
verify = "Test de l'extension : la couche quitte le projet, son fichier reste intact, une couche absente rend le meme resultat sans erreur ; test du rejeu dans la meme session et dans une session neuve (identique) ; core/tests/catalogue.rs vert avec la fiche faite ; recette QGIS reelle : « retire la couche ... du projet » retire la couche et le rejeu est identique."
covers = ["CAP-14"]
after = []
hitl = false
risk = "high"
references = ["change-commande-layer-remove/change-commande-layer-remove.md", "architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-24", "architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-11"]

