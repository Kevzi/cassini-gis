# tickets.toml — epic 10, catalogue etendu par les algorithmes de traitement de QGIS.
# L'ordre des tables est l'ordre de construction ; `id` nomme une entree pour de bon.
# Les primitives (entrees 9 a 15, et 20) ajoutent chacune une ligne a la meme table fermee
# de l'extension, des modules au registre et des descriptions au prompt : elles forment
# une seule voie, chacune apres la precedente.

# ---- Traceur construit d'abord (derogation du proprietaire, 2026-11-08) ----

[[entry]]
id = 7
type = "story"
title = "Traceur : reprojection de bout en bout (data.reproject)"
description = "Ajoute data.reproject, premiere primitive du catalogue etendu, par le chemin complet mis a niveau : commande Rust et schema, ligne de table avec version de chaine, annonce, prompt, plan compose dans le panneau, execution, journal et rejeu."
verify = "Dans QGIS, le proprietaire tape « Reprojette la couche des gares en WGS84 », valide le plan, obtient la couche reprojetee, puis la rejoue depuis le journal apres fermeture et reouverture du projet."
covers = ["CAP-14"]
