[[entry]]
id = 3
type = "story"
title = "Geste a chaine fixe et invariants de la table fermee"
description = "Fait de chaque ligne de la table de l'extension une chaine fixe d'algorithmes avec gardes, temporaires non journalises et version de chaine (AD-24), migre les lignes existantes, declare une commande annulable seulement si chaque algorithme l'est, et fait refuser par la recette toute ligne qui cite un algorithme de la liste noire reseau ; le genre vector et les sorties layer et file sont livres ici, les genres raster et layout et la sortie table par la premiere primitive qui en a besoin, apres le reordonnancement de l'entree 8 (aujourd'hui 10 pour table, 12 pour raster, 15 pour layout)."
verify = "Tests de l'extension sur les deux series de QGIS : une chaine de deux algorithmes ecrit seulement la sortie nommee par le noyau, un test confronte la table au registre sur l'annulabilite, et la recette echoue sur une ligne de test qui nomme native:filedownloader."
covers = ["CAP-6", "CAP-14"]
after = [2]
hitl = false
risk = "high"
references = ["architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-24", "architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-12", "architecture-noyau-et-facade-qgis/architecture-noyau-et-facade-qgis.md#ad-14"]

