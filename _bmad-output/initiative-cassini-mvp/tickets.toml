# tickets.toml — les epics de l'initiative, en ordre de construction.
# L'ordre des tables est l'ordre de construction ; `id` nomme un epic pour de bon.
# Reordonne le 2026-10-14 par le virage change-facade-qgis-avant-app-autonome :
# QGIS porte l'habillage au MVP, le noyau porte le registre, l'agent, le journal
# et le terrain. L'epic 3 est retire, les epics 8 et 9 sont nouveaux.

[[epic]]
id = 1
slug = "epic-socle-et-carte"
title = "Socle technique, verrou hors ligne et recette"
covers = ["CAP-1"]

[[epic]]
id = 8
slug = "epic-epreuve-du-modele-local"
title = "Epreuve du modele local sur registre factice"
covers = []

[[epic]]
id = 2
slug = "epic-registre-projet-import"
title = "Registre de commandes et journal rejouable"
covers = ["CAP-6", "CAP-7"]
after = [
  { epic = 1, needs = "le workspace, le verrou hors ligne dans le moteur et la recette automatique" },
  { epic = 8, needs = "le verdict sur la capacite d'un modele local a composer des commandes, qui dicte la forme des descriptions et des schemas de parametres" },
]

[[epic]]
id = 9
slug = "epic-facade-qgis"
title = "Facade QGIS : extension, canal local, commandes executees par QGIS"
covers = ["CAP-13", "CAP-9", "CAP-10", "CAP-3", "CAP-5"]
after = [{ epic = 2, needs = "le contrat du registre de commandes, que l'extension consomme" }]

[[epic]]
id = 5
slug = "epic-agent-et-mcp"
title = "Agent en langage naturel et serveur MCP"
covers = ["CAP-4", "CAP-8"]
after = [
  { epic = 2, needs = "le registre complet, pour que l'agent ait des verbes a composer et un inventaire a lire" },
  { epic = 8, needs = "le modele, la quantification et la forme de sollicitation retenus par l'epreuve" },
  { epic = 9, needs = "le panneau ou afficher le plan etape par etape et le faire valider" },
  { epic = 4, needs = "les familles du generateur pour les trois commandes de terrain (4.6), apprises au re-entrainement groupe 5.41" },
]

[[epic]]
id = 4
slug = "epic-raster-et-terrain"
title = "Analyse de terrain dans le noyau"
covers = ["CAP-11"]
after = [{ epic = 2, needs = "le contrat du registre de commandes" }]

[[epic]]
id = 12
slug = "epic-refonte-du-panneau"
title = "Refonte du panneau : le fil de la demande"
covers = ["CAP-13", "CAP-4"]
after = [
  { epic = 9, needs = "le panneau de l'extension (9.4) et son client du noyau" },
  { epic = 5, needs = "le plan propose, valide et execute par l'agent, que le fil affiche" },
]

[[epic]]
id = 11
slug = "epic-geometrie-et-terrain-etendu"
title = "Geometrie et terrain etendu, catalogue des commandes fige"
covers = ["CAP-15", "CAP-5", "CAP-6"]
after = [
  { epic = 4, needs = "le module raster unique et les trois commandes de terrain, que cet epic prolonge" },
  { epic = 5, needs = "la chaine d'entrainement reproductible (5.10) et le generateur d'exemples, pour le re-entrainement groupe" },
  { epic = 9, needs = "la table fermee de l'extension et la mise en page, pour data.transform_point et les options d'export" },
]

[[epic]]
id = 6
slug = "epic-export-et-demo"
title = "Scenario de demo de bout en bout"
covers = []
after = [
  { epic = 9, needs = "les commandes executees par QGIS que la phrase de demo enchaine, export PDF compris" },
  { epic = 5, needs = "l'agent qui enchaine les commandes et les fait valider" },
  { epic = 4, needs = "les commandes de terrain du noyau, pour la demonstration sur poste isole" },
  { epic = 11, needs = "le catalogue des commandes fige et la geometrie et le terrain etendu, ajoutes avant la demo par le changement de cap du 2026-11-05" },
]

[[epic]]
id = 7
slug = "epic-publication"
title = "Publication : depot d'extensions QGIS, installeurs, video"
covers = []
after = [{ epic = 6, needs = "le scenario de demo complet, a filmer et a documenter" }]

[[epic]]
id = 10
slug = "epic-catalogue-etendu-qgis"
title = "Catalogue etendu par les algorithmes de traitement de QGIS"
covers = ["CAP-6", "CAP-14"]
after = [
  { epic = 5, needs = "le cache de la partie fixe du prompt (5.12) et la chaine d'entrainement reproductible du modele (5.10)" },
  { epic = 4, needs = "les MNT de recette (4.1) et l'inventaire des rasters (4.3), pour l'entree 20" },
  { epic = 6, needs = "le MVP complet et la demo, qui figent le registre et l'agent sur lesquels le catalogue s'etend" },
  { epic = 7, needs = "la chaine de publication de l'extension et du paquet, par laquelle le catalogue etendu est livre" },
]

# ---- Retire ----
# L'epic 3 est retire le 2026-10-14 : CAP-3 part a l'epic 9 (executee par QGIS) et
# CAP-7 part a l'epic 2. Sa table reste ici pour que l'id 3 ne soit jamais
# reattribue. Voir le Dropped: de epic-analyses-et-historique.md.

[[epic]]
id = 3
slug = "epic-analyses-et-historique"
title = "Analyses vectorielles et historique rejouable"
covers = []
