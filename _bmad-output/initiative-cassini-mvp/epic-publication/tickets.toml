description = "Complète metadata.txt (version 0.1.0, experimental=False, homepage, repository, tracker, email = cassini-sig@proton.me, description sans « traceur »), ajoute l'icône et le LICENSE à l'archive construite par 7.2, et soumet l'extension au dépôt (compte OSGeo et approbation : étape hitl)."
