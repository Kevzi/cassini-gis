title = "Licences de tout ce qui est livré et frontière GPL"
description = "Un outil de génération (licence à faire approuver par le propriétaire avant ajout : étape hitl) liste les licences des crates du noyau, de llama.cpp, de Qwen et de l'outil d'installeur ; la liste et un texte sur la frontière GPL entre l'extension et le noyau entrent dans la release et dans les installeurs des deux systèmes."
