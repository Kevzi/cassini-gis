[package]
name = "cassini"
description = "Binaire cassini : points d'entree du registre de commandes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cassini"
path = "src/main.rs"

[dependencies]
cassini-ai = { path = "../ai" }
cassini-core = { path = "../core" }
serde_json = "1"
# Serveur MCP (ticket 5.7, decision du proprietaire 2026-10-30) : rmcp (Apache-2.0), sans
# transport reseau, et tokio (MIT) reduit au runtime a un fil et aux flux standard (AD-14).
rmcp = { version = "=3.8.0", default-features = false, features = ["server"] }
tokio = { version = "1", default-features = false, features = ["rt", "io-std"] }

# Paquet livre (ticket 5.21) : moteurs de calcul a part, carte graphique Vulkan prise si elle se
# charge, processeur sinon. Hors defaut (SDK Vulkan requis a la construction).
[features]
gpu = ["cassini-ai/gpu"]

# Lecture de la table d'imports du binaire (licence Apache-2.0 OR MIT), tests seulement.
[dev-dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "pe"] }
