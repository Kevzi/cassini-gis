# Garde AD-14 : licences permissives et aucune porte ouverte sur le reseau.
# Portee : le noyau (core, ai, cli). La coquille Tauri `app/src-tauri` (V2)
# est exclue : elle tire une pile web qui n'est pas dans le chemin du MVP.

[graph]
exclude = ["cassini-app"]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unlicense", "MIT-0", "Zlib"]
confidence-threshold = 0.9

[advisories]
# RUSTSEC-2026-0543 : `chrono` n'est plus maintenu (aucune faille, aucune version corrigée). Il
# arrive par `rmcp` et `schemars`, que le noyau ne peut pas remplacer. À lever dès qu'ils passent à
# `jiff` ou `time`.
ignore = ["RUSTSEC-2026-0543"]

[bans]
multiple-versions = "allow"
deny = [
  # clients HTTP
  { crate = "reqwest" }, { crate = "hyper" }, { crate = "ureq" }, { crate = "curl" },
  { crate = "isahc" }, { crate = "attohttpc" }, { crate = "surf" },
  # piles async ; tokio n'est admis que sous le serveur MCP (ticket 5.7), sans `net` (voir plus bas)
  { crate = "tokio", wrappers = ["rmcp", "tokio-util", "cassini"] }, { crate = "async-std" }, { crate = "smol" },
  { crate = "tokio-util", wrappers = ["rmcp"] },
  # TLS
  { crate = "openssl" }, { crate = "native-tls" }, { crate = "rustls" },
  { crate = "schannel" },
  # le noyau ne depend pas de la couche IA : seul le binaire cassini la tire
  { crate = "cassini-ai", wrappers = ["cassini"] },
]

# tokio sert le serveur MCP sur l'entrée et la sortie standard : sa feature `net` (sockets) est
# interdite, et avec elle la feature `transport-io` de rmcp qui la tire (AD-14).
[[bans.features]]
crate = "tokio"
deny = ["net"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
