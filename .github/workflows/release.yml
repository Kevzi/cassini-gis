# Release de Cassini (ticket 7.1, AD-17). Le job `linux` (7.7) construit avant lui le noyau processeur
# Linux, ses deux archives et la preuve de cassini.sh ; le job Windows les joint au manifeste.
#
# Une étiquette `vX.Y.Z` fait construire le noyau Windows gpu (Vulkan, SDK à empreinte fixée, ticket 7.6),
# assemble le paquet par liste fermée, lance la garde hors ligne sur ce paquet, compile l'installeur en ligne, prouve l'installation (manifeste
# valide, puis manifeste altéré) et seulement alors publie la release : `cassini.exe`,
# les DLL, l'installeur et `manifeste.json`. Construit par GitHub Actions, jamais sur le poste du
# propriétaire. Actions officielles de GitHub seulement ; Inno Setup est celui du poste de GitHub
# (voir docs/publier-une-version.md).

name: Release

on:
  push:
    tags:
      # Versions complètes seulement : une étiquette de préversion ne doit jamais devenir
      # la « dernière » release, vers laquelle pointent les adresses fixes d'AD-17.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Essai à blanc, lancé à la main sur une branche : tout se construit et se prouve comme sur
  # une étiquette (version de Cargo.toml), mais rien n'est publié.
  workflow_dispatch:

# Seul workflow à écrire : la publication de la release.
permissions:
  contents: write

jobs:
  # ---- Linux (7.7) : noyau processeur, deux archives, preuve de cassini.sh ----
  # Ubuntu 22.04 (glibc 2.35) : le noyau tourne sur toute distribution au moins aussi récente.
  # Sans `gpu` (pas de Vulkan sous Linux) ni `target-cpu=native` : une base x86-64 générique.
  linux:
    name: Linux (noyau processeur, archives)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Étiquette visée
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then t="$GITHUB_REF_NAME"
          else t="v$(python -I -c "import sys; sys.path.insert(0, 'installer'); import manifeste; print(manifeste.version_cargo(manifeste.RACINE / 'Cargo.toml'))")"; fi
          echo "TAG=$t" >> "$GITHUB_ENV"

      - name: Étiquette égale à la version Cargo
        run: python -I installer/verifier_etiquette.py

      - name: Tests de l'installeur (cassini.sh compris)
        run: python -I -m unittest discover -s installer/tests

      # libclang pour bindgen (llama.cpp) ; cmake, g++ et binutils (objdump) sont déjà sur le poste.
      - name: Outils de construction
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev cmake build-essential binutils

      - name: Construction du noyau (processeur)
        run: cargo build --release -p cassini --locked

      # Licences livrées (R7) : crates du noyau lues dans cargo metadata (`cargo fetch` tire les sources de toutes les
      # plateformes, que `cargo metadata --offline` exige), échec si une crate n'a pas de licence ou est sous GPL ou LGPL.
      - name: Licences de ce qui est livré
        run: |
          cargo fetch --locked
          python -I installer/licences.py --sortie dist/licences

      # Garde hors ligne sur le binaire livré : table des symboles importés (ELF).
      - name: Garde hors ligne sur le binaire livré
        run: cargo test --release -p cassini --test hors_ligne --locked

      - name: Noyau en release
        run: ./target/release/cassini run system.about

      # Le modèle (~2,8 Go) vient de Hugging Face, empreinte vérifiée ; jamais construit ici.
      - name: Téléchargement du modèle (empreinte vérifiée)
        run: |
          nom=$(python -I -c "import json; print(json.load(open('installer/modele.json'))['nom_installe'])")
          python -I installer/telecharger_modele.py --sortie "modele/$nom"

      # Liste fermée, plafond glibc 2.35 (objdump -T) : l'assemblage échoue au-delà.
      - name: Archives Linux (liste fermée, glibc au plus 2.35)
        run: |
          nom=$(python -I -c "import json; print(json.load(open('installer/modele.json'))['nom_installe'])")
          python -I installer/assembler_linux.py --binaire target/release/cassini --modele "modele/$nom"             --textes dist/licences --version "${TAG#v}" --sortie dist-linux
          cp installer/cassini.sh dist-linux/cassini.sh
          rm -rf target modele
          df -h .
          ls -l dist-linux

      # Preuve de cassini.sh sur les archives livrées : porte 1 (serveur local, petit modèle de
      # preuve), octet changé, mise à jour, à jour, non installé ; porte 2 sans réseau.
      - name: Preuve de l'installation Linux
        run: |
          python -I installer/preuve_linux.py --etiquette "$TAG" --script installer/cassini.sh             --noyau "dist-linux/cassini-noyau-linux-${TAG#v}.tar.gz"             --complet "dist-linux/cassini-complet-linux-${TAG#v}.tar"

      # Le tar complet dépasse les 2 Gio d'une release GitHub : artefact du workflow, repris par le
      # job Windows (manifeste, dépôt Hugging Face) et pour l'essai en VM du propriétaire.
      - name: Artefact, archives Linux
        uses: actions/upload-artifact@v4
        with:
          name: cassini-linux-${{ env.TAG }}
          path: dist-linux/*
          compression-level: 0
          retention-days: 14

  release:
    name: Release Windows (noyau gpu, installeurs)
    needs: linux
    runs-on: windows-latest
    env:
      # Chemin de build court : CMake échoue au-delà de MAX_PATH.
      CARGO_TARGET_DIR: C:\ct
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # TAG : l'étiquette poussée ; pour un essai à blanc, `v` + la version de Cargo.toml.
      - name: Étiquette visée
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $t = $env:GITHUB_REF_NAME }
          else { $t = 'v' + (python -I -c "import sys; sys.path.insert(0, 'installer'); import manifeste; print(manifeste.version_cargo(manifeste.RACINE / 'Cargo.toml'))") }
          "TAG=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Rien n'est construit ni publié si l'étiquette diffère de la version de Cargo.toml.
      - name: Étiquette égale à la version Cargo
        run: python -I installer/verifier_etiquette.py

      - name: Tests du manifeste
        run: python -I -m unittest discover -s installer/tests

      # SDK Vulkan : outil de construction seulement (glslc compile les shaders, les en-têtes
      # décrivent l'API). Jamais livré ; vulkan-1.dll vient du pilote de l'utilisateur. Version
      # et empreinte fixées (publiées par LunarG) : si l'empreinte diffère, la recette échoue
      # ici, avant toute compilation.
      - name: SDK Vulkan 1.4.363.0 (empreinte vérifiée)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.363.0'
          $attendue = '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $exe = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $exe
          $reelle = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($reelle -ne $attendue) { throw "SDK Vulkan : SHA-256 $reelle différent de l'empreinte fixée $attendue ; construction arrêtée" }
          $p = Start-Process $exe -ArgumentList 'install','--accept-licenses','--default-answer','--confirm-command' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installation du SDK Vulkan : code $($p.ExitCode)" }
          $sdk = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "glslc.exe absent de $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Remove-Item $exe -Force

      # Noyau unique, gpu : sans carte ni pilote Vulkan, il retombe sur le processeur à
      # l'exécution (docs/paquet-du-noyau.md).
      - name: Construction du noyau (gpu, Vulkan)
        # Ninja, comme sur le poste du propriétaire : avec le générateur Visual Studio, le
        # sous-projet vulkan-shaders-gen de llama.cpp échoue (essais à blanc 7.6, MSB8066).
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          ninja --version
          cargo build --release -p cassini --features gpu --locked

      # La garde porte sur le paquet livré : même dossier cible que la construction.
      - name: Garde hors ligne sur le paquet livré
        run: cargo test --release -p cassini --features gpu --test hors_ligne --locked

      - name: Noyau en release
        run: C:\ct\release\cassini.exe run system.about

      # Licences livrées (R7) : LICENCES-TIERCES.txt et FRONTIERE-GPL.txt, joints au paquet du noyau
      # (donc au manifeste, à l'installeur en ligne et à la porte 2) et à la release.
      - name: Licences de ce qui est livré
        run: |
          cargo fetch --locked
          python -I installer/licences.py --sortie dist/licences

      # Liste fermée : échoue si un fichier manque ou si un autre est présent (llama-common.dll
      # embarque un client HTTP, jamais livrée).
      - name: Assemblage du paquet du noyau (liste fermée)
        run: python -I installer/assembler_noyau.py --source C:\ct\release --textes dist/licences --sortie dist/noyau

      - name: Le paquet assemblé répond
        run: |
          $sortie = & dist\noyau\cassini.exe run system.about 2>&1
          $code = $LASTEXITCODE
          Write-Host $sortie
          if ($code -ne 0) { throw ("paquet assemblé : code 0x{0:X}" -f $code) }

      # Inno Setup est déjà installé sur le poste de GitHub (licence permissive propre, voir
      # docs/publier-une-version.md) : on affiche sa version dans le journal, sans rien installer.
      - name: Inno Setup (version du poste)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 absent du poste" }
          (Get-Item $iscc).VersionInfo.ProductVersion

      - name: Compilation de l'installeur en ligne
        run: |
          $version = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" installer\cassini-en-ligne.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }
          Copy-Item installer-sortie\cassini-installeur-en-ligne.exe dist\

      - name: Manifeste des versions
        shell: pwsh
        run: |
          $fichiers = @(Get-ChildItem dist\noyau -File | ForEach-Object { $_.FullName })
          python -I installer/manifeste.py --etiquette $env:TAG --modele --sortie dist/manifeste.json @fichiers
          if ($LASTEXITCODE -ne 0) { throw "manifeste : échec" }

      # Preuve de l'installeur contre un serveur local : manifeste valide, puis altéré.
      - name: Preuve de l'installation (valide puis altéré)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = "$PWD\proof"
          New-Item -ItemType Directory -Force "$proof\valide", "$proof\altere" | Out-Null
          Copy-Item dist\noyau\* "$proof\"
          $fichiers = @(Get-ChildItem dist\noyau -File | ForEach-Object { $_.FullName })
          # Modèle de preuve : un petit fichier servi en local, sous le nom et avec les champs
          # de installer/modele.json (le vrai modèle de 2,8 Go n'est pas téléchargé ici) ;
          # une copie dont un octet est changé sert au cas « octet changé ».
          $nomModele = (Get-Content installer/modele.json -Raw | ConvertFrom-Json).nom_installe
          $octets = New-Object byte[] 1048576
          (New-Object Random 7).NextBytes($octets)
          [IO.File]::WriteAllBytes("$proof\modele-bon.gguf", $octets)
          $octets[1000] = $octets[1000] -bxor 1
          [IO.File]::WriteAllBytes("$proof\modele-altere.gguf", $octets)
          $shaModele = (Get-FileHash "$proof\modele-bon.gguf" -Algorithm SHA256).Hash.ToLower()
          foreach ($v in 'bon','altere') {
            @{ url = "http://127.0.0.1:8000/modele-$v.gguf"; sha256 = $shaModele; taille = 1048576; nom_installe = $nomModele } |
              ConvertTo-Json | Set-Content "$proof\modele-$v.json" -Encoding utf8
          }
          python -I installer/manifeste.py --etiquette $env:TAG --base-url http://127.0.0.1:8000 --modele "$proof\modele-bon.json" --sortie "$proof\valide\manifeste.json" @fichiers
          if ($LASTEXITCODE -ne 0) { throw "manifeste de preuve : échec" }
          New-Item -ItemType Directory -Force "$proof\modele-altere" | Out-Null
          python -I installer/manifeste.py --etiquette $env:TAG --base-url http://127.0.0.1:8000 --modele "$proof\modele-altere.json" --sortie "$proof\modele-altere\manifeste.json" @fichiers
          if ($LASTEXITCODE -ne 0) { throw "manifeste de preuve (modèle altéré) : échec" }
          # Manifeste altéré : le premier caractère de l'empreinte de la DERNIÈRE entrée de
          # `fichiers` (une DLL, ni le noyau ni le modèle) est changé.
          $json = Get-Content "$proof\valide\manifeste.json" -Raw
          $avantModele = $json.Substring(0, $json.IndexOf('"modele"'))
          $m = [regex]::Matches($avantModele, '"sha256": "(.)') | Select-Object -Last 1
          $c = if ($m.Groups[1].Value -eq '0') { '1' } else { '0' }
          $json = $json.Remove($m.Groups[1].Index, 1).Insert($m.Groups[1].Index, $c)
          [IO.File]::WriteAllText("$proof\altere\manifeste.json", $json)

          $srv = Start-Process python -ArgumentList '-I','-m','http.server','8000','--bind','127.0.0.1','--directory',$proof -PassThru -WindowStyle Hidden
          try {
            # Le serveur répond avant le premier essai (au plus 30 s).
            $pret = $false
            for ($i = 0; $i -lt 30 -and -not $pret; $i++) {
              if ($srv.HasExited) { throw "le serveur local s'est arrêté" }
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/valide/manifeste.json | Out-Null; $pret = $true }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $pret) { throw "le serveur local ne répond pas" }
            $inst = "$PWD\dist\cassini-installeur-en-ligne.exe"

            # 1. Manifeste valide : le noyau est posé et répond.
            $dir1 = "$proof\inst-valide"
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir1",'/MANIFESTE=http://127.0.0.1:8000/valide/manifeste.json' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installation valide : code $($p.ExitCode)" }
            foreach ($f in Get-ChildItem dist\noyau -File) {
              if (-not (Test-Path "$dir1\bin\$($f.Name)")) { throw "$($f.Name) absent du paquet installé" }
            }
            if (-not (Test-Path "$dir1\bin\ggml-vulkan.dll")) { throw "ggml-vulkan.dll absente" }
            foreach ($f in Get-ChildItem dist\noyau -File) {
              $a = (Get-FileHash $f.FullName).Hash; $b = (Get-FileHash "$dir1\bin\$($f.Name)").Hash
              Write-Host ("{0} {1}" -f $f.Name, $(if ($a -eq $b) { 'identique' } else { 'DIFFERENT' }))
            }
            $sortie = & "$dir1\bin\cassini.exe" run system.about 2>&1
            $code = $LASTEXITCODE
            Write-Host $sortie
            if ($code -ne 0) { throw ("cassini.exe run system.about a échoué : code 0x{0:X}" -f $code) }
            $info = Get-Content "$dir1\bin\installation.json" -Raw | ConvertFrom-Json
            if ($info.version -ne $env:TAG.TrimStart('v')) { throw "version installée : $($info.version)" }
            if (-not $info.installe_le) { throw "date d'installation absente" }
            Write-Host "installation.json : $($info | ConvertTo-Json -Compress)"

            # Modèle (case cochée par défaut) : posé, déclaration avec model_sha256.
            $gguf1 = "$dir1\bin\models\$nomModele"
            if ((Get-FileHash $gguf1 -Algorithm SHA256).Hash.ToLower() -ne $shaModele) { throw "modèle installé différent" }
            $decl = Get-Content "$dir1\bin\models\cassini-composition-4b.modele.json" -Raw | ConvertFrom-Json
            if ($decl.model -ne $nomModele -or $decl.model_sha256 -ne $shaModele -or $decl.prompt -ne 'short') { throw "déclaration du modèle incorrecte" }
            $liste = & "$dir1\bin\cassini.exe" run model.list | Out-String
            Write-Host $liste
            if ($liste -match 'models\.tampered') { throw "model.list signale models.tampered" }
            if ($liste -notmatch [regex]::Escape($nomModele)) { throw "model.list ne liste pas le modèle" }

            # Désinstallation : le noyau disparaît, le modèle et sa déclaration restent.
            Start-Process "$dir1\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
            for ($i = 0; $i -lt 20 -and (Test-Path "$dir1\bin\cassini.exe"); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path "$dir1\bin\cassini.exe") { throw "désinstallation : cassini.exe existe encore" }
            if (-not (Test-Path $gguf1)) { throw "désinstallation : le modèle a été supprimé" }
            if (-not (Test-Path "$dir1\bin\models\cassini-composition-4b.modele.json")) { throw "désinstallation : la déclaration a été supprimée" }

            # 1 bis. Sans modèle (/MODELE=0) : noyau posé, aucun fichier dans models, code 0.
            $dir1b = "$proof\inst-sans-modele"
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir1b",'/MODELE=0','/MANIFESTE=http://127.0.0.1:8000/valide/manifeste.json' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installation sans modèle : code $($p.ExitCode)" }
            if (-not (Test-Path "$dir1b\bin\cassini.exe")) { throw "sans modèle : noyau absent" }
            if (Test-Path "$dir1b\bin\models\*") { throw "sans modèle : models n'est pas vide" }
            Write-Host "sans modèle : noyau posé, models vide"

            # 1 quater. Mise à jour (/MISEAJOUR, même programme). Version A (0.0.1, modèle sous
            # l'ancien nom sans version), puis manifeste B (0.0.2, modèle versionné) : le noyau est
            # remplacé, l'ancien modèle et sa déclaration restent, le nouveau est à côté.
            $nomAncien = 'cassini-composition-4b-Q4_K_M.gguf'
            $octets = New-Object byte[] 1048576
            (New-Object Random 8).NextBytes($octets)
            [IO.File]::WriteAllBytes("$proof\modele-ancien.gguf", $octets)
            $shaAncien = (Get-FileHash "$proof\modele-ancien.gguf" -Algorithm SHA256).Hash.ToLower()
            @{ url = "http://127.0.0.1:8000/modele-ancien.gguf"; sha256 = $shaAncien; taille = 1048576; nom_installe = $nomAncien } |
              ConvertTo-Json | Set-Content "$proof\modele-ancien.json" -Encoding utf8
            New-Item -ItemType Directory -Force "$proof\maj-a", "$proof\maj-b" | Out-Null
            $ecrire = 'import sys; sys.path.insert(0, "installer"); import manifeste as m; from pathlib import Path; v, base, mod, out = sys.argv[1:5]; Path(out).write_text(m.construire(v, [Path(f) for f in sys.argv[5:]], base, m.section_modele(Path(mod))), encoding="utf-8", newline="\n")'
            python -I -c $ecrire 0.0.1 http://127.0.0.1:8000 "$proof\modele-ancien.json" "$proof\maj-a\manifeste.json" @fichiers
            if ($LASTEXITCODE -ne 0) { throw "manifeste A : échec" }
            python -I -c $ecrire 0.0.2 http://127.0.0.1:8000 "$proof\modele-bon.json" "$proof\maj-b\manifeste.json" @fichiers
            if ($LASTEXITCODE -ne 0) { throw "manifeste B : échec" }
            $dirM = "$proof\inst-maj"
            $urlA = 'http://127.0.0.1:8000/maj-a/manifeste.json'
            $urlB = 'http://127.0.0.1:8000/maj-b/manifeste.json'
            $maj = @('/MISEAJOUR','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dirM","/MANIFESTE=$urlB")

            # Cassini non installé : refusé, rien posé, code non nul.
            $dirVide = "$proof\inst-maj-vide"
            $p = Start-Process $inst -ArgumentList '/MISEAJOUR','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dirVide","/MANIFESTE=$urlB" -Wait -PassThru
            if ($p.ExitCode -eq 0) { throw "/MISEAJOUR sans Cassini installé aurait dû échouer" }
            if (Test-Path "$dirVide\bin\*") { throw "/MISEAJOUR sans installation : un fichier a été posé" }

            # Installation de la version A.
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dirM","/MANIFESTE=$urlA" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installation de A : code $($p.ExitCode)" }
            if ((Get-Content "$dirM\bin\installation.json" -Raw | ConvertFrom-Json).version -ne '0.0.1') { throw "A : version installée incorrecte" }
            if (-not (Test-Path "$dirM\bin\models\$nomAncien")) { throw "A : ancien modèle absent" }

            # Noyau en cours d'usage (fichier ouvert sans partage de suppression) : refusé, rien posé.
            $verrou = [IO.File]::Open("$dirM\bin\cassini.exe", 'Open', 'Read', 'Read')
            try {
              $p = Start-Process $inst -ArgumentList $maj -Wait -PassThru
            } finally { $verrou.Close() }
            if ($p.ExitCode -eq 0) { throw "/MISEAJOUR avec le noyau verrouillé aurait dû échouer" }
            if ((Get-Content "$dirM\bin\installation.json" -Raw | ConvertFrom-Json).version -ne '0.0.1') { throw "noyau verrouillé : installation.json a changé" }
            if (Test-Path "$dirM\bin\models\$nomModele") { throw "noyau verrouillé : un modèle a été posé" }

            # Mise à jour de A vers B.
            $p = Start-Process $inst -ArgumentList $maj -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "/MISEAJOUR : code $($p.ExitCode)" }
            foreach ($f in Get-ChildItem dist\noyau -File) {
              if ((Get-FileHash $f.FullName).Hash -ne (Get-FileHash "$dirM\bin\$($f.Name)").Hash) { throw "mise à jour : $($f.Name) différent" }
            }
            $info = Get-Content "$dirM\bin\installation.json" -Raw | ConvertFrom-Json
            if ($info.version -ne '0.0.2' -or -not $info.installe_le) { throw "mise à jour : installation.json incorrect" }
            if ((Get-FileHash "$dirM\bin\models\$nomAncien" -Algorithm SHA256).Hash.ToLower() -ne $shaAncien) { throw "mise à jour : l'ancien modèle a changé" }
            if ((Get-FileHash "$dirM\bin\models\$nomModele" -Algorithm SHA256).Hash.ToLower() -ne $shaModele) { throw "mise à jour : le nouveau modèle est incorrect" }
            $declAncienne = Get-Content "$dirM\bin\models\cassini-composition-4b.modele.json" -Raw | ConvertFrom-Json
            if ($declAncienne.model -ne $nomAncien -or $declAncienne.model_sha256 -ne $shaAncien) { throw "mise à jour : l'ancienne déclaration a changé" }
            $declNouvelle = Get-Content ("$dirM\bin\models\" + $nomModele.Substring(0, $nomModele.Length - 5) + '.modele.json') -Raw | ConvertFrom-Json
            if ($declNouvelle.model -ne $nomModele -or $declNouvelle.model_sha256 -ne $shaModele) { throw "mise à jour : la nouvelle déclaration est incorrecte" }
            if (-not (Test-Path "$dirM\mettre-a-jour-cassini.exe")) { throw "mise à jour : la copie de l'installeur est absente" }
            $liste = & "$dirM\bin\cassini.exe" run model.list | Out-String
            Write-Host $liste
            if ($liste -match 'models\.tampered') { throw "mise à jour : model.list signale models.tampered" }
            if ($liste -notmatch [regex]::Escape($nomAncien) -or $liste -notmatch [regex]::Escape($nomModele)) { throw "mise à jour : model.list ne liste pas les deux modèles" }

            # Second passage, même manifeste : à jour, rien réécrit, code 0.
            $avant = @("$dirM\bin\installation.json", "$dirM\bin\cassini.exe", "$dirM\bin\models\$nomModele") |
              ForEach-Object { "{0}|{1}" -f (Get-FileHash $_).Hash, (Get-Item $_).LastWriteTimeUtc.Ticks }
            Start-Sleep -Seconds 2
            $p = Start-Process $inst -ArgumentList $maj -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "/MISEAJOUR à jour : code $($p.ExitCode)" }
            $apres = @("$dirM\bin\installation.json", "$dirM\bin\cassini.exe", "$dirM\bin\models\$nomModele") |
              ForEach-Object { "{0}|{1}" -f (Get-FileHash $_).Hash, (Get-Item $_).LastWriteTimeUtc.Ticks }
            if (($avant -join ';') -ne ($apres -join ';')) { throw "/MISEAJOUR à jour : un fichier a été réécrit" }
            Write-Host "mise à jour : A vers B puis à jour, deux modèles et deux déclarations"
            Start-Process "$dirM\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait

            # 1 ter. Modèle servi avec un octet changé : tout est refusé, noyau compris.
            $dir1c = "$proof\inst-modele-altere"
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir1c",'/MANIFESTE=http://127.0.0.1:8000/modele-altere/manifeste.json' -Wait -PassThru
            if ($p.ExitCode -eq 0) { throw "le modèle altéré aurait dû être refusé" }
            if (Test-Path "$dir1c\bin\*") { throw "un fichier a été posé malgré le modèle altéré" }
            Write-Host "modèle altéré refusé (code $($p.ExitCode))"

            # 2. Empreinte altérée : installation refusée, rien posé.
            $dir2 = "$proof\inst-altere"
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir2",'/MANIFESTE=http://127.0.0.1:8000/altere/manifeste.json' -Wait -PassThru
            if ($p.ExitCode -eq 0) { throw "l'installation altérée aurait dû être refusée" }
            if (Test-Path "$dir2\bin\*") { throw "un fichier a été posé malgré l'empreinte fausse" }
            Write-Host "empreinte altérée refusée (code $($p.ExitCode))"

            # 3. Manifeste injoignable (aucun serveur sur ce port) : installation refusée.
            $dir3 = "$proof\inst-injoignable"
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir3",'/MANIFESTE=http://127.0.0.1:8001/manifeste.json' -Wait -PassThru
            if ($p.ExitCode -eq 0) { throw "l'installation sans manifeste aurait dû être refusée" }
            if (Test-Path "$dir3\bin\cassini.exe") { throw "un fichier a été posé sans manifeste" }
            Write-Host "manifeste injoignable refusé (code $($p.ExitCode))"
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      # ---- Porte 2 (7.2) : installeur complet hors ligne, un seul fichier ----
      # Tout échoue avant la publication : archive trop lourde ou avec un binaire, modèle
      # introuvable ou altéré (SHA-256 fixé dans installer/modele.json), fichier trop gros.
      - name: Archive de l'extension (sans binaire, moins de 25 Mo)
        run: python -I installer/archive_extension.py --sortie "dist/cassini_qgis-$($env:TAG.TrimStart('v')).zip"

      # Le modèle (~2,8 Go) vient de Hugging Face (publié par 7.3) ; jamais construit ici.
      # Le script vérifie l'espace libre avant de télécharger et l'empreinte après.
      - name: Téléchargement du modèle (empreinte vérifiée)
        run: python -I installer/telecharger_modele.py --sortie modele/cassini-composition-4b-0.2.0-Q4_K_M.gguf

      - name: Compilation de l'installeur complet
        run: |
          $version = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" installer\cassini-hors-ligne.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué (installeur complet)" }
          # Le modèle source n'est plus utile : on libère le disque avant l'essai.
          Remove-Item -Recurse -Force modele

      - name: Taille de l'installeur complet (un seul fichier)
        run: python -I installer/verifier_taille.py installer-sortie/cassini-installeur-complet.exe

      # L'installeur n'a aucune fonction réseau (garde statique dans les tests) ; la règle du
      # pare-feu ne bloque que l'exécutable de l'installeur, pas ses copies temporaires. La vraie
      # preuve « machine débranchée » est l'essai en VM du propriétaire.
      - name: Preuve de l'installation complète (pare-feu sur l'installeur)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = "$PWD\installer-sortie\cassini-installeur-complet.exe"
          $version = $env:TAG.TrimStart('v')
          $regle = 'cassini-installeur-complet-sans-reseau'
          $dir = "$PWD\proof-complet"
          $modele = Get-Content installer/modele.json -Raw | ConvertFrom-Json
          New-NetFirewallRule -DisplayName $regle -Direction Outbound -Program $inst -Action Block | Out-Null
          try {
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installation complète : code $($p.ExitCode)" }
          } finally {
            Remove-NetFirewallRule -DisplayName $regle -ErrorAction SilentlyContinue
          }
          foreach ($f in Get-ChildItem dist\noyau -File) {
            if (-not (Test-Path "$dir\bin\$($f.Name)")) { throw "$($f.Name) absent du paquet installé" }
          }
          $sortie = & "$dir\bin\cassini.exe" run system.about 2>&1
          $code = $LASTEXITCODE
          Write-Host $sortie
          if ($code -ne 0) { throw ("cassini.exe run system.about a échoué : code 0x{0:X}" -f $code) }
          # Le modèle est listé par model.list (le noyau le cherche dans models\ à côté de lui).
          $liste = & "$dir\bin\cassini.exe" run model.list | Out-String
          Write-Host $liste
          if ($liste -notmatch 'cassini-composition-4b-0.2.0-Q4_K_M\.gguf') { throw "model.list ne liste pas le modèle" }
          if ($liste -notmatch [string]$modele.taille) { throw "model.list ne donne pas la taille $($modele.taille)" }
          $gguf = "$dir\bin\models\cassini-composition-4b-0.2.0-Q4_K_M.gguf"
          if ((Get-FileHash $gguf -Algorithm SHA256).Hash.ToLower() -ne $modele.sha256) { throw "SHA-256 du modèle installé différent" }
          if (-not (Test-Path "$dir\extension\cassini_qgis-$version.zip")) { throw "archive de l'extension absente" }
          $info = Get-Content "$dir\bin\installation.json" -Raw | ConvertFrom-Json
          if ($info.version -ne $version -or -not $info.installe_le) { throw "installation.json incorrect" }
          # Désinstallation : le dossier bin disparaît.
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\bin"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\bin\cassini.exe") { throw "désinstallation : cassini.exe existe encore" }
          foreach ($f in @($gguf, "$dir\bin\models\cassini-composition-4b.modele.json", "$dir\bin\installation.json", "$dir\extension\cassini_qgis-$version.zip")) {
            if (Test-Path $f) { throw "désinstallation : $f existe encore" }
          }

      # Archives Linux construites et prouvées par le job `linux` (7.7).
      - name: Archives Linux du job linux
        uses: actions/download-artifact@v4
        with:
          name: cassini-linux-${{ env.TAG }}
          path: dist-linux

      # Porte 2 dans le manifeste (7.4) : nom versionné, adresse Hugging Face, SHA-256 et taille
      # du fichier construit ci-dessus. Le manifeste final est fini ICI, avant `gh release create`.
      - name: Manifeste complet (section porte2) et empreintes de la porte 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fichiers = @(Get-ChildItem dist\noyau -File | ForEach-Object { $_.FullName })
          $v = $env:TAG.TrimStart('v')
          $tarNoyau = "dist-linux/cassini-noyau-linux-$v.tar.gz"
          $tarComplet = "dist-linux/cassini-complet-linux-$v.tar"
          python -I installer/manifeste.py --etiquette $env:TAG --modele --porte2 installer-sortie/cassini-installeur-complet.exe --linux $tarNoyau $tarComplet --sortie dist/manifeste.json @fichiers
          if ($LASTEXITCODE -ne 0) { throw "manifeste complet : échec" }
          $m = Get-Content dist/manifeste.json -Raw | ConvertFrom-Json
          if (-not $m.modele -or -not $m.porte2) { throw "manifeste : section modele ou porte2 absente" }
          if (-not $m.linux -or -not $m.linux.noyau -or -not $m.linux.porte2) { throw "manifeste : section linux absente" }
          Write-Host ($m.porte2 | ConvertTo-Json -Compress)
          # Déclaration d'empreintes déposée à côté du fichier sur Hugging Face.
          New-Item -ItemType Directory -Force hf-depot | Out-Null
          # Lien dur : le fichier fait plusieurs Go, on ne le copie pas.
          New-Item -ItemType HardLink -Path "hf-depot\$($m.porte2.nom)" -Target (Resolve-Path installer-sortie/cassini-installeur-complet.exe) | Out-Null
          [ordered]@{ version = $m.version; nom = $m.porte2.nom; sha256 = $m.porte2.sha256; taille = $m.porte2.taille } |
            ConvertTo-Json | Set-Content "hf-depot\$($m.porte2.nom -replace '\.exe$','.empreintes.json')" -Encoding utf8
          # Porte 2 Linux : même dépôt, même forme de déclaration d'empreintes.
          New-Item -ItemType HardLink -Path "hf-depot\$($m.linux.porte2.nom)" -Target (Resolve-Path "dist-linux/$($m.linux.porte2.nom)") | Out-Null
          [ordered]@{ version = $m.version; nom = $m.linux.porte2.nom; sha256 = $m.linux.porte2.sha256; taille = $m.linux.porte2.taille } |
            ConvertTo-Json | Set-Content "hf-depot\$($m.linux.porte2.nom -replace '\.tar$','.empreintes.json')" -Encoding utf8

      # Dépôt sur Hugging Face : seulement si le jeton HF_TOKEN est présent (secret du dépôt).
      # Sans jeton, un avis et on continue : le manifeste annonce alors une adresse pas encore servie.
      - name: Dépôt de la porte 2 sur Hugging Face (jeton HF_TOKEN)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:HF_TOKEN) {
            Write-Host "::warning::HF_TOKEN absent : la porte 2 n'est pas déposée sur Hugging Face (voir docs/publier-une-version.md)"
            exit 0
          }
          $modele = Get-Content installer/modele.json -Raw | ConvertFrom-Json
          $depot = ([Uri]$modele.url).AbsolutePath.Trim('/') -replace '^([^/]+/[^/]+)/.*$','$1'
          python -m pip install --quiet "huggingface_hub==0.26.2"
          if ($LASTEXITCODE -ne 0) { throw "installation de huggingface_hub : échec" }
          python -c "import sys; from huggingface_hub import HfApi; HfApi(token=sys.argv[2]).upload_folder(repo_id=sys.argv[1], folder_path='hf-depot', repo_type='model', commit_message='Porte 2 ' + sys.argv[3])" $depot $env:HF_TOKEN $env:TAG
          if ($LASTEXITCODE -ne 0) { throw "dépôt sur Hugging Face : échec" }

      # Le fichier dépasse les 2 Gio d'une release GitHub : il est livré comme artefact du
      # workflow (onglet Actions), pour l'essai en VM du propriétaire.
      - name: Artefact, installeur complet
        uses: actions/upload-artifact@v4
        with:
          name: cassini-installeur-complet-${{ env.TAG }}
          path: |
            installer-sortie/cassini-installeur-complet.exe
            dist/cassini_qgis-*.zip
          compression-level: 0
          retention-days: 14

      # Dernière étape : tout ce qui précède est vert.
      - name: Publication de la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:TAG
          (Get-ChildItem dist/noyau -File | ForEach-Object { $_.FullName })
          dist/cassini-installeur-en-ligne.exe dist/manifeste.json
          (Get-ChildItem dist-linux -File -Filter 'cassini-noyau-linux-*.tar.gz' | ForEach-Object { $_.FullName })
          dist-linux/cassini.sh
          --title "Cassini $env:TAG" --generate-notes --verify-tag
