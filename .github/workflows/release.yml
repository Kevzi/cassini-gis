# Release de Cassini (ticket 7.1, AD-17).
#
# Une étiquette `vX.Y.Z` fait construire le noyau Windows processeur, lance la garde hors
# ligne sur CE binaire, compile l'installeur en ligne, prouve l'installation (manifeste
# valide, puis manifeste altéré) et seulement alors publie la release : `cassini.exe`,
# l'installeur et `manifeste.json`. Construit par GitHub Actions, jamais sur le poste du
# propriétaire. Actions officielles de GitHub seulement ; Inno Setup est celui du poste de GitHub
# (voir docs/publier-une-version.md).

name: Release

on:
  push:
    tags:
      # Versions complètes seulement : une étiquette de préversion ne doit jamais devenir
      # la « dernière » release, vers laquelle pointent les adresses fixes d'AD-17.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Essai à blanc, lancé à la main sur une branche : tout se construit et se prouve comme sur
  # une étiquette (version de Cargo.toml), mais rien n'est publié.
  workflow_dispatch:

# Seul workflow à écrire : la publication de la release.
permissions:
  contents: write

jobs:
  release:
    name: Release Windows (noyau processeur, installeur en ligne)
    runs-on: windows-latest
    env:
      # Chemin de build court : CMake échoue au-delà de MAX_PATH.
      CARGO_TARGET_DIR: C:\ct
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # TAG : l'étiquette poussée ; pour un essai à blanc, `v` + la version de Cargo.toml.
      - name: Étiquette visée
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $t = $env:GITHUB_REF_NAME }
          else { $t = 'v' + (python -I -c "import sys; sys.path.insert(0, 'installer'); import manifeste; print(manifeste.version_cargo(manifeste.RACINE / 'Cargo.toml'))") }
          "TAG=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Rien n'est construit ni publié si l'étiquette diffère de la version de Cargo.toml.
      - name: Étiquette égale à la version Cargo
        run: python -I installer/verifier_etiquette.py

      - name: Tests du manifeste
        run: python -I -m unittest discover -s installer/tests

      - name: Construction du noyau (processeur)
        run: cargo build --release -p cassini --locked

      # La garde porte sur le binaire livré : même dossier cible que la construction.
      - name: Garde hors ligne sur le binaire livré
        run: cargo test --release -p cassini --test hors_ligne --locked

      - name: Noyau en release
        run: C:\ct\release\cassini.exe run system.about

      - name: Fichiers à livrer
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item C:\ct\release\cassini.exe dist\cassini.exe

      # Inno Setup est déjà installé sur le poste de GitHub (licence permissive propre, voir
      # docs/publier-une-version.md) : on affiche sa version dans le journal, sans rien installer.
      - name: Inno Setup (version du poste)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 absent du poste" }
          (Get-Item $iscc).VersionInfo.ProductVersion

      - name: Compilation de l'installeur en ligne
        run: |
          $version = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" installer\cassini-en-ligne.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }
          Copy-Item installer-sortie\cassini-installeur-en-ligne.exe dist\

      - name: Manifeste des versions
        run: python -I installer/manifeste.py --etiquette $env:TAG --sortie dist/manifeste.json dist/cassini.exe

      # Preuve de l'installeur contre un serveur local : manifeste valide, puis altéré.
      - name: Preuve de l'installation (valide puis altéré)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = "$PWD\proof"
          New-Item -ItemType Directory -Force "$proof\valide", "$proof\altere" | Out-Null
          Copy-Item dist\cassini.exe "$proof\cassini.exe"
          python -I installer/manifeste.py --etiquette $env:TAG --base-url http://127.0.0.1:8000 --sortie "$proof\valide\manifeste.json" dist/cassini.exe
          # Manifeste altéré : le premier caractère de l'empreinte est changé.
          $json = Get-Content "$proof\valide\manifeste.json" -Raw
          $m = [regex]::Match($json, '"sha256": "(.)')
          $c = if ($m.Groups[1].Value -eq '0') { '1' } else { '0' }
          $json = $json.Remove($m.Groups[1].Index, 1).Insert($m.Groups[1].Index, $c)
          [IO.File]::WriteAllText("$proof\altere\manifeste.json", $json)

          $srv = Start-Process python -ArgumentList '-I','-m','http.server','8000','--bind','127.0.0.1','--directory',$proof -PassThru -WindowStyle Hidden
          try {
            # Le serveur répond avant le premier essai (au plus 30 s).
            $pret = $false
            for ($i = 0; $i -lt 30 -and -not $pret; $i++) {
              if ($srv.HasExited) { throw "le serveur local s'est arrêté" }
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/valide/manifeste.json | Out-Null; $pret = $true }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $pret) { throw "le serveur local ne répond pas" }
            $inst = "$PWD\dist\cassini-installeur-en-ligne.exe"

            # 1. Manifeste valide : le noyau est posé et répond.
            $dir1 = "$proof\inst-valide"
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir1",'/MANIFESTE=http://127.0.0.1:8000/valide/manifeste.json' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installation valide : code $($p.ExitCode)" }
            if (-not (Test-Path "$dir1\bin\cassini.exe")) { throw "cassini.exe absent" }
            & "$dir1\bin\cassini.exe" run system.about
            if ($LASTEXITCODE -ne 0) { throw "cassini.exe run system.about a échoué" }
            $info = Get-Content "$dir1\bin\installation.json" -Raw | ConvertFrom-Json
            if ($info.version -ne $env:TAG.TrimStart('v')) { throw "version installée : $($info.version)" }
            if (-not $info.installe_le) { throw "date d'installation absente" }
            Write-Host "installation.json : $($info | ConvertTo-Json -Compress)"

            # Désinstallation : le dossier disparaît.
            Start-Process "$dir1\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
            for ($i = 0; $i -lt 20 -and (Test-Path "$dir1\bin"); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path "$dir1\bin") { throw "désinstallation : bin existe encore" }

            # 2. Empreinte altérée : installation refusée, rien posé.
            $dir2 = "$proof\inst-altere"
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir2",'/MANIFESTE=http://127.0.0.1:8000/altere/manifeste.json' -Wait -PassThru
            if ($p.ExitCode -eq 0) { throw "l'installation altérée aurait dû être refusée" }
            if (Test-Path "$dir2\bin\cassini.exe") { throw "un fichier a été posé malgré l'empreinte fausse" }
            Write-Host "empreinte altérée refusée (code $($p.ExitCode))"

            # 3. Manifeste injoignable (aucun serveur sur ce port) : installation refusée.
            $dir3 = "$proof\inst-injoignable"
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir3",'/MANIFESTE=http://127.0.0.1:8001/manifeste.json' -Wait -PassThru
            if ($p.ExitCode -eq 0) { throw "l'installation sans manifeste aurait dû être refusée" }
            if (Test-Path "$dir3\bin\cassini.exe") { throw "un fichier a été posé sans manifeste" }
            Write-Host "manifeste injoignable refusé (code $($p.ExitCode))"
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      # ---- Porte 2 (7.2) : installeur complet hors ligne, un seul fichier ----
      # Tout échoue avant la publication : archive trop lourde ou avec un binaire, modèle
      # introuvable ou altéré (SHA-256 fixé dans installer/modele.json), fichier trop gros.
      - name: Archive de l'extension (sans binaire, moins de 25 Mo)
        run: python -I installer/archive_extension.py --sortie "dist/cassini_qgis-$($env:TAG.TrimStart('v')).zip"

      # Le modèle (~2,8 Go) vient de Hugging Face (publié par 7.3) ; jamais construit ici.
      # Le script vérifie l'espace libre avant de télécharger et l'empreinte après.
      - name: Téléchargement du modèle (empreinte vérifiée)
        run: python -I installer/telecharger_modele.py --sortie modele/cassini-composition-4b-Q4_K_M.gguf

      - name: Compilation de l'installeur complet
        run: |
          $version = $env:TAG.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" installer\cassini-hors-ligne.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué (installeur complet)" }
          # Le modèle source n'est plus utile : on libère le disque avant l'essai.
          Remove-Item -Recurse -Force modele

      - name: Taille de l'installeur complet (un seul fichier)
        run: python -I installer/verifier_taille.py installer-sortie/cassini-installeur-complet.exe

      # L'installeur n'a aucune fonction réseau (garde statique dans les tests) ; la règle du
      # pare-feu ne bloque que l'exécutable de l'installeur, pas ses copies temporaires. La vraie
      # preuve « machine débranchée » est l'essai en VM du propriétaire.
      - name: Preuve de l'installation complète (pare-feu sur l'installeur)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = "$PWD\installer-sortie\cassini-installeur-complet.exe"
          $version = $env:TAG.TrimStart('v')
          $regle = 'cassini-installeur-complet-sans-reseau'
          $dir = "$PWD\proof-complet"
          $modele = Get-Content installer/modele.json -Raw | ConvertFrom-Json
          New-NetFirewallRule -DisplayName $regle -Direction Outbound -Program $inst -Action Block | Out-Null
          try {
            $p = Start-Process $inst -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "installation complète : code $($p.ExitCode)" }
          } finally {
            Remove-NetFirewallRule -DisplayName $regle -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "$dir\bin\cassini.exe")) { throw "cassini.exe absent" }
          & "$dir\bin\cassini.exe" run system.about
          if ($LASTEXITCODE -ne 0) { throw "cassini.exe run system.about a échoué" }
          # Le modèle est listé par model.list (le noyau le cherche dans models\ à côté de lui).
          $liste = & "$dir\bin\cassini.exe" run model.list | Out-String
          Write-Host $liste
          if ($liste -notmatch 'cassini-composition-4b-Q4_K_M\.gguf') { throw "model.list ne liste pas le modèle" }
          if ($liste -notmatch [string]$modele.taille) { throw "model.list ne donne pas la taille $($modele.taille)" }
          $gguf = "$dir\bin\models\cassini-composition-4b-Q4_K_M.gguf"
          if ((Get-FileHash $gguf -Algorithm SHA256).Hash.ToLower() -ne $modele.sha256) { throw "SHA-256 du modèle installé différent" }
          if (-not (Test-Path "$dir\extension\cassini_qgis-$version.zip")) { throw "archive de l'extension absente" }
          $info = Get-Content "$dir\bin\installation.json" -Raw | ConvertFrom-Json
          if ($info.version -ne $version -or -not $info.installe_le) { throw "installation.json incorrect" }
          # Désinstallation : le dossier bin disparaît.
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\bin"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\bin\cassini.exe") { throw "désinstallation : cassini.exe existe encore" }
          foreach ($f in @($gguf, "$dir\bin\models\cassini-composition-4b.modele.json", "$dir\bin\installation.json", "$dir\extension\cassini_qgis-$version.zip")) {
            if (Test-Path $f) { throw "désinstallation : $f existe encore" }
          }

      # Le fichier dépasse les 2 Gio d'une release GitHub : il est livré comme artefact du
      # workflow (onglet Actions), pour l'essai en VM du propriétaire.
      - name: Artefact, installeur complet
        uses: actions/upload-artifact@v4
        with:
          name: cassini-installeur-complet-${{ env.TAG }}
          path: |
            installer-sortie/cassini-installeur-complet.exe
            dist/cassini_qgis-*.zip
          compression-level: 0
          retention-days: 14

      # Dernière étape : tout ce qui précède est vert.
      - name: Publication de la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:TAG
          dist/cassini.exe dist/cassini-installeur-en-ligne.exe dist/manifeste.json
          --title "Cassini $env:TAG" --generate-notes --verify-tag
